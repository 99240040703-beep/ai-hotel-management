<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090806" />

    <title>Paradise Restaurant — Good Food, Great Mood</title>

    <meta
      name="description"
      content="Paradise Restaurant — delicious food, cozy ambience and unforgettable moments. Browse the menu, reserve a table, or order from your table QR."
    />

    <!-- Open Graph, so a shared link previews as the restaurant rather
         than as a blank page. -->
    <meta property="og:title" content="Paradise Restaurant" />
    <meta
      property="og:description"
      content="Good food, great mood. Reserve a table or order from your table QR."
    />
    <meta property="og:type" content="restaurant" />

    <!-- Typography.
         Two families only, as a serif display and a humanist body. The
         preconnect lets the browser start the handshake while the CSS
         parses, and `display=swap` means text renders in the fallback
         immediately rather than waiting on the network - so if Google
         Fonts is blocked the page still looks correct, just less
         refined. The stacks in theme.css name the same faces as system
         fallbacks for exactly that case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- A preconnect to the image CDN the dish helpers use, so the first
         food photo does not start a fresh TLS handshake. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
